# Le kiosque range les numéros, et l’un d’eux s’ouvre sur son sommaire.
#
# La couverture est touchée par un point et non par un mot : ce qu’elle porte est le jour et le compte d’un numéro,
# que des formateurs écrivent et qu’aucun dictionnaire ne tient — un parcours qui les recopierait dirait deux fois ce
# qui n’est écrit qu’une, et changerait de faux dès le lendemain.
#
# Ce qui prouve qu’un numéro s’est ouvert est la disparition de « Kiosque » : le sommaire est poussé à la racine de la
# pile et couvre la barre du bas, comme un article, et rien d’autre sur cet écran ne fait disparaître la barre.
#
# « L’Humanité » est le fronton que chaque couverture porte. Sur l’onglet du kiosque, c’est le seul endroit où le mot
# est peint : l’écran d’accueil porte le sien, mais il n’est pas à l’écran.
appId: ${APP_ID}
---
- runFlow: parts/launch.yaml
- tapOn: 'Kiosque'
- assertVisible: 'L’Humanité'
- takeScreenshot: newsstand
- tapOn:
    point: 21%,20%
- extendedWaitUntil:
    notVisible: 'Kiosque'
    timeout: 20000
- takeScreenshot: issue
- back
- assertVisible: 'Kiosque'
- assertVisible: 'L’Humanité'
