# Démarre l’app par le lien profond du dev client, servie par Metro, et la pose sur la une. Chaque parcours commence
# par là : le dev client n’a pas d’icône à toucher, et l’app ne tourne pas tant que Metro ne l’a pas servie.
#
# Attendre « Accueil » ne suffit pas à savoir où l’on est : la barre du bas nomme ses cinq onglets, si bien que ce mot
# est à l’écran sur n’importe lequel. L’app rouvre sur le dernier onglet visité, et un parcours a démarré sur l’étagère
# vide en croyant être sur la une — il y a cherché un marque-page à poser et n’en a trouvé aucun.
#
# Donc on y va, au lieu de supposer y être : on touche l’onglet d’accueil, puis on vérifie le fronton du journal, qui
# est le seul mot qu’aucun autre onglet ne porte.
appId: ${APP_ID}
---
- stopApp
- openLink: ${DEV_CLIENT_LINK}
- extendedWaitUntil:
    visible: 'Accueil'
    timeout: 180000
- tapOn: 'Accueil'
- assertVisible: 'L’Humanité'
