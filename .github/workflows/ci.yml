# La CI rejoue sur le serveur ce que les hooks font en local, et ce qu'ils ne font pas : chercher un secret dans tout
# l'historique, et construire l'app en natif depuis un clone propre, sans aucun secret. Les builds sont celles qu'une
# release publie : la variante de service, qui lit le journal comme un passant — sans clé ni connexion d'abonné.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: pnpm verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hooks:check relit chaque message depuis l'ancre des hooks, et refuse un clone superficiel.
          fetch-depth: 0
          # Une PR se vérifie sur sa tête : le commit de fusion que GitHub en synthétise porte un message « Merge … »
          # que la règle des messages refuse.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm hooks:install
      - run: pnpm verify

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # La somme de l'archive linux_x64 de cette version, relevée dans son fichier de sommes : une archive changée sous
      # le même numéro ne s'installe pas.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Installer gitleaks à sa somme épinglée
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
      - name: Chercher un secret dans tout l'historique
        run: '"${RUNNER_TEMP}/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose .'

  android:
    name: build Android
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_CONTENT_SOURCE: service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      - name: Générer android/ depuis la configuration de l'app
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Le prebuild n'a réécrit aucun fichier suivi
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
      # La variante release du dépôt (tools/emulator/src/variant.ts), pour le processeur d'un téléphone.
      - name: Construire l'APK de release
        working-directory: apps/mobile/android
        run: >-
          ./gradlew assembleRelease
          -PreactNativeArchitectures=arm64-v8a
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          --no-daemon
          --console=plain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-arm64-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: build iOS
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_CONTENT_SOURCE: service
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Générer ios/ depuis la configuration de l'app
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios --no-install
      - name: Le prebuild n'a réécrit aucun fichier suivi
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Installer les pods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Construire l'app pour le simulateur, sans signature
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -version
          workspace="$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          scheme="$(basename "${workspace}" .xcworkspace)"
          xcodebuild -quiet build \
            -workspace "${workspace}" \
            -scheme "${scheme}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
          tar -czf "${RUNNER_TEMP}/ios-simulator.tar.gz" -C build/Build/Products/Release-iphonesimulator "${scheme}.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-simulator-release-${{ github.sha }}
          path: ${{ runner.temp }}/ios-simulator.tar.gz
          if-no-files-found: error
          retention-days: 14
