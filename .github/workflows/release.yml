# Une release sort d'un tag vX.Y.Z posé sur un commit de main dont la CI est verte, et dont l'app porte la même
# version (apps/mobile/app.config.ts). Elle publie ce que la CI construit — la variante de service, qui lit le journal
# comme un passant, sans clé ni connexion d'abonné — : l'APK Android signé par la clé de release, l'app pour le
# simulateur iOS, leurs sommes SHA-256 et une attestation de provenance.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPO_PUBLIC_CONTENT_SOURCE: service
  # L'empreinte du certificat de la clé de release : un APK signé par une autre clé ne sort pas.
  RELEASE_CERT_SHA256: b58a1ae9db2379bea06357aa187bed8ffd3b9f6c879ad8e522d6a4058879971e

# Aucun cache : une release se construit depuis le seul contenu du tag et du lockfile.
jobs:
  gate:
    name: tag, version et CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: L'app porte la version du tag
        id: version
        working-directory: apps/mobile
        run: |
          version="$(pnpm exec expo config --type public --json | jq -r .version)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::le tag ${GITHUB_REF_NAME} ne nomme pas la version de l'app, ${version} (apps/mobile/app.config.ts)"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Le tag est posé sur main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_SHA} n'est pas un commit de main"
            exit 1
          fi
      - name: La CI de main est verte sur ce commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for check in 'pnpm verify' 'secrets (gitleaks)' 'build Android' 'build iOS'; do
            name="$(jq -rn --arg check "${check}" '$check | @uri')"
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=${name}" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | max_by(.completed_at) | .conclusion // "absente"')"
            if [ "${conclusion}" != 'success' ]; then
              echo "::error::${check} : ${conclusion} sur ${GITHUB_SHA} ; attendre que la CI de main soit verte, puis relancer"
              exit 1
            fi
          done

  android:
    name: APK Android signé
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: release
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      - name: Générer android/ depuis la configuration de l'app
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Le prebuild n'a réécrit aucun fichier suivi
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Construire l'APK de release
        working-directory: apps/mobile/android
        run: >-
          ./gradlew assembleRelease
          -PreactNativeArchitectures=arm64-v8a
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          --no-daemon
          --console=plain
      - name: Signer par la clé de release
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          keystore="${RUNNER_TEMP}/release.p12"
          printf '%s' "${KEYSTORE}" | base64 --decode > "${keystore}"
          "${tools}/zipalign" -P 16 -f 4 apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "${RUNNER_TEMP}/aligned.apk"
          mkdir -p dist
          apk="dist/humanite-${VERSION}-android-arm64.apk"
          "${tools}/apksigner" sign --ks "${keystore}" --ks-type PKCS12 --ks-key-alias humanite \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "${apk}" "${RUNNER_TEMP}/aligned.apk"
          rm -f "${keystore}"
          "${tools}/apksigner" verify --print-certs "${apk}" | tee "${RUNNER_TEMP}/certificates.txt"
          grep -q "certificate SHA-256 digest: ${RELEASE_CERT_SHA256}" "${RUNNER_TEMP}/certificates.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          path: dist/
          if-no-files-found: error
          retention-days: 7

  ios:
    name: app iOS pour simulateur
    needs: gate
    runs-on: macos-26
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Générer ios/ depuis la configuration de l'app
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios --no-install
      - name: Le prebuild n'a réécrit aucun fichier suivi
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Installer les pods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Construire l'app pour le simulateur, sans signature
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -version
          workspace="$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          scheme="$(basename "${workspace}" .xcworkspace)"
          xcodebuild -quiet build \
            -workspace "${workspace}" \
            -scheme "${scheme}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          tar -czf "${GITHUB_WORKSPACE}/dist/humanite-${VERSION}-ios-simulator.tar.gz" \
            -C build/Build/Products/Release-iphonesimulator "${scheme}.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ios
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publier la release
    needs: [gate, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Sommes SHA-256
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/humanite-*
      - name: Notes de version
        run: |
          tag="${GITHUB_REF_NAME}"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          previous="$(git describe --tags --abbrev=0 --match 'v*' "${tag}^" 2>/dev/null || true)"
          range="${previous:+${previous}..}${tag}"
          notes="${RUNNER_TEMP}/notes.md"
          cat > "${notes}" <<'EOF'
          > **Client non officiel** de _L'Humanité_, ni affilié au journal ni approuvé par lui. Cette version lit le
          > service du journal comme un passant : les articles libres s'ouvrent, les articles réservés restent fermés, et
          > la connexion de l'abonné n'y est pas.

          EOF
          git tag -l --format='%(contents:body)' "${tag}" >> "${notes}"
          cat > "${RUNNER_TEMP}/details.md" <<'EOF'

          ### Installer

          - **Android 7 et plus** (arm64) : `humanite-@VERSION@-android-arm64.apk`, en autorisant l'installation depuis cette source.
          - **Simulateur iOS** d'un Mac : `tar -xzf humanite-@VERSION@-ios-simulator.tar.gz`, puis `xcrun simctl install booted LHumanit.app`. Aucune build pour iPhone : elle demanderait un compte Apple Developer et une publication.

          ### Vérifier

          - Les sommes : `sha256sum -c SHA256SUMS`
          - La provenance : `gh attestation verify <fichier> -R @REPOSITORY@`
          - La signature Android : `apksigner verify --print-certs <apk>` rend le SHA-256 `@CERTIFICATE@`

          ### Changements depuis @PREVIOUS@

          EOF
          sed -e "s|@VERSION@|${VERSION}|g" -e "s|@REPOSITORY@|${GITHUB_REPOSITORY}|g" \
            -e "s|@CERTIFICATE@|${RELEASE_CERT_SHA256}|g" -e "s|@PREVIOUS@|${previous:-le début}|g" \
            "${RUNNER_TEMP}/details.md" >> "${notes}"
          for kind in 'feat:Nouveautés' 'fix:Corrections' 'perf:Performances'; do
            type="${kind%%:*}"
            lines="$(git log --no-merges --format='- %s (%h)' "${range}" | grep -E "^- ${type}(\([a-z0-9-]+\))?!?: " || true)"
            if [ -n "${lines}" ]; then
              count="$(printf '%s\n' "${lines}" | wc -l | tr -d ' ')"
              printf '<details><summary>%s — %s</summary>\n\n%s\n\n</details>\n\n' "${kind#*:}" "${count}" "${lines}" >> "${notes}"
            fi
          done
          cat "${notes}"
      - name: Publier
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft --verify-tag \
            --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" dist/*
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
