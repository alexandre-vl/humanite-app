packages:
  - packages/*
  - tools/*

nodeLinker: isolated
enableGlobalVirtualStore: false
strictDepBuilds: true
pmOnFail: error
verifyDepsBeforeRun: error
minimumReleaseAge: 1440
catalogMode: strict

catalog:
  '@eslint/js': 10.0.1
  '@types/node': 24.13.4
  eslint: 10.10.0
  prettier: 3.9.6
  typescript: 6.0.3
  typescript-eslint: 8.70.0
  vitest: 5.0.0
