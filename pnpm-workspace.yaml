packages:
  - apps/*
  - infra/*
  - packages/*
  - tools/*
nodeLinker: isolated
enableGlobalVirtualStore: false
strictDepBuilds: true
strictPeerDependencies: true
pmOnFail: error
verifyDepsBeforeRun: error
minimumReleaseAge: 1440
catalogMode: strict
peerDependencyRules:
  ignoreMissing:
    - react-dom
