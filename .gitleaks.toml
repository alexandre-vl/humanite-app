# La recherche de secrets de la CI : les règles de gitleaks, et les seuls faux positifs que l'historique leur montre,
# chacun nommé et borné à sa forme. Rien d'autre ne s'y ajoute sans avoir été lu.

[extend]
useDefault = true

[[allowlists]]
description = "Les secrets inventés des preuves de la capture : chacun y est faux par construction, pour prouver que la lecture l'arrête."
paths = ['''^tools/capture/src/proofs/secrets\.ts$''']

[[allowlists]]
description = "Les clés des visuels du corpus fictif, rubrique-article-nom : des noms, que la règle générique prend pour des clés."
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''^\s*key: '[a-z]{3}-[ab][0-9]+(?:-[a-z0-9]+)+',$''']

[[allowlists]]
description = "La clé publique du client officiel, portée en clair par l'app (ADR-0040) : un credential que tout abonné relève de son propre trafic, non une clé privée."
paths = ['''^packages/remote-api/src/routes\.ts$''']
regexTarget = "line"
regexes = ['''export const CLIENT_SECRET = '[^']+';''']
